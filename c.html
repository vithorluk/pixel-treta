<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pixel Treta - Controle</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #12122a; color: #fff; font-family: monospace; overflow: hidden; touch-action: none; overscroll-behavior: none; }
  #login { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; }
  #login h1 { margin: 0; color: #ffd23f; font-size: 28px; letter-spacing: 2px; }
  #login input { font: inherit; font-size: 22px; padding: 12px; width: min(280px, 80vw); text-align: center; text-transform: uppercase; border: 3px solid #fff; background: #000; color: #fff; border-radius: 0; -webkit-user-select: text; user-select: text; }
  #login button { font: inherit; font-size: 22px; font-weight: bold; padding: 14px 40px; background: #ffd23f; color: #000; border: 0; }
  #pad { position: absolute; inset: 0; display: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #bar { position: absolute; top: 0; left: 0; right: 0; height: 10px; background: #fff; }
  #status { position: absolute; top: 16px; left: 0; right: 0; text-align: center; font-size: 13px; opacity: .8; }
  #stick { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; }
  #dpad { position: absolute; left: 50%; top: 55%; width: min(46vw, 80vh); height: min(22vw, 38vh); transform: translate(-50%, -50%); display: flex; gap: 6%; pointer-events: none; }
  #dpad div, .btn { border: 4px solid #fff; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: bold; }
  #dpad div { flex: 1; } #dpad div.on, .btn.on { background: #fff; color: #000; }
  #down { position: absolute; left: 25%; bottom: 3%; transform: translateX(-50%); font-size: 12px; opacity: .6; pointer-events: none; }
  .btn { position: absolute; width: min(21vw, 40vh); height: min(21vw, 40vh); border-radius: 50%; }
  #bA { right: 3%; top: 16%; } #bU { right: 25%; bottom: 8%; }
  .btn small { font-size: 11px; position: absolute; bottom: 16%; }
  #rot { position: absolute; inset: 0; background: #12122a; display: none; align-items: center; justify-content: center; font-size: 20px; text-align: center; padding: 30px; z-index: 5; }
  @media (orientation: portrait) { body.playing #rot { display: flex; } }
</style>
</head>
<body>
<div id="login">
  <h1>PIXEL TRETA</h1>
  <input id="room" maxlength="4" placeholder="SALA" autocomplete="off">
  <input id="name" maxlength="8" placeholder="SEU NOME" autocomplete="off">
  <button id="go">ENTRAR</button>
</div>
<div id="pad">
  <div id="bar"></div><div id="status">conectando…</div>
  <div id="stick"><div id="dpad"><div id="dl">◀</div><div id="dr">▶</div></div><div id="down">deslize pra baixo = descer da plataforma</div></div>
  <div class="btn" id="bA">A<small>ATACAR</small></div>
  <div class="btn" id="bU">B<small>PULAR</small></div>
</div>
<div id="rot">Vire o celular de lado ↻</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const L = 1, R = 2, U = 4, D = 8, A = 16;
const $ = id => document.getElementById(id);
let peer, conn, name = '', room = '', bits = 0, sent = -1, retry = null;
try { $('name').value = localStorage.getItem('pt-name') || ''; } catch (e) {}
room = (new URLSearchParams(location.search).get('r') || '').toUpperCase();
if (room) $('room').style.display = 'none';

function again() { if (retry) return; $('status').textContent = 'reconectando…'; retry = setTimeout(() => { retry = null; connect(); }, 1500); }
function connect() {
  try { if (peer) peer.destroy(); } catch (e) {}
  conn = null; peer = new Peer();
  peer.on('open', () => {
    const c = peer.connect('pixeltreta-' + room, { reliable: true }); conn = c;
    c.on('open', () => { c.send({ t: 'join', name }); sent = -1; push(); $('status').textContent = name + ' · sala ' + room; });
    c.on('data', m => {
      if (m.t === 'you') { $('bar').style.background = m.color; $('status').style.color = m.color; }
      else if (m.t === 'fx') {
        if (navigator.vibrate) navigator.vibrate(m.k === 'hit' ? 40 : m.k === 'dead' ? [80, 40, 160] : [40, 40, 40, 40, 120]);
        if (m.k === 'dead') { document.body.style.background = '#501018'; setTimeout(() => document.body.style.background = '', 400); }
      }
    });
    c.on('close', again); c.on('error', again);
  });
  peer.on('error', e => { $('status').textContent = e.type === 'peer-unavailable' ? 'sala ' + room + ' não encontrada' : 'reconectando…'; again(); });
}
function push(force) { if ((force || bits !== sent) && conn && conn.open) { conn.send({ t: 'in', b: bits }); sent = bits; } }
function set(mask, on) { bits = on ? bits | mask : bits & ~mask; push(); }
setInterval(() => push(true), 1000); // sinal de vida pra tela
document.addEventListener('visibilitychange', () => { if (!document.hidden && name && !(conn && conn.open)) again(); });

$('go').onclick = () => {
  if (!room) room = $('room').value.trim().toUpperCase();
  if (room.length !== 4) { $('room').focus(); return; }
  name = ($('name').value.trim() || 'P' + (Math.random() * 90 + 10 | 0)).toUpperCase();
  try { localStorage.setItem('pt-name', name); } catch (e) {}
  $('login').style.display = 'none'; $('pad').style.display = 'block'; document.body.classList.add('playing');
  document.documentElement.requestFullscreen?.().catch(() => {});
  connect();
};
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

// lado esquerdo: direcional por posicao do dedo
const stick = $('stick'); let sid = null;
function stickAt(e) {
  const r = stick.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  const l = x < 0.47, rt = x > 0.53, d = y > 0.8;
  bits = (bits & ~(L | R | D)) | (l ? L : 0) | (rt ? R : 0) | (d ? D : 0);
  $('dl').classList.toggle('on', l); $('dr').classList.toggle('on', rt); push();
}
stick.addEventListener('pointerdown', e => { sid = e.pointerId; stick.setPointerCapture(sid); stickAt(e); });
stick.addEventListener('pointermove', e => { if (e.pointerId === sid) stickAt(e); });
const stickUp = e => { if (e.pointerId !== sid) return; sid = null; bits &= ~(L | R | D); $('dl').classList.remove('on'); $('dr').classList.remove('on'); push(); };
stick.addEventListener('pointerup', stickUp); stick.addEventListener('pointercancel', stickUp);

for (const [id, mask] of [['bA', A], ['bU', U]]) {
  const el = $(id);
  el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); el.classList.add('on'); set(mask, true); });
  const up = () => { el.classList.remove('on'); set(mask, false); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>
</body>
</html>
