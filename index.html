<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Treta</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: monospace; color: #fff; }
  canvas { position: absolute; inset: 0; margin: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
  #join { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.75); border: 2px solid #ffd23f; padding: 6px 10px; text-align: center; font-size: 13px; }
  #join svg { width: 14vh; height: 14vh; display: block; margin: 0 auto 4px; background: #fff; }
  #join b { color: #ffd23f; }
  #join.big { right: auto; bottom: auto; left: 50%; top: 77%; transform: translate(-50%, -50%); font-size: 16px; padding: 10px 14px; }
  #join.big svg { width: 24vh; height: 24vh; }
  #join.small { border-width: 1px; opacity: .7; font-size: 11px; padding: 3px 6px; }
  #join.small #qr, #join.small .l { display: none; }
  #tip { position: absolute; left: 8px; bottom: 8px; font-size: 11px; opacity: .6; }
</style>
</head>
<body>
<canvas id="cv" width="384" height="216"></canvas>
<div id="join" class="big"><div id="qr"></div><div class="l">Aponte a câmera ou abra</div><b class="l" id="url">conectando…</b><div>Sala: <b id="code"></b></div></div>
<div id="tip">Clique para tela cheia e som · H mostra o QR · M troca de fase</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="game.js"></script>
<script>
const { Game, W, H } = PixelTreta;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();

// som simples (liga depois do primeiro clique)
let ac = null;
function tone(freq, dur, type, vol, slide) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
const SFX = {
  shot: () => tone(700, .08, 'square', .08, 120), rocket: () => tone(200, .3, 'sawtooth', .1, 60),
  punch: () => tone(180, .06, 'square', .08, 90), hit: () => tone(320, .07, 'triangle', .12, 110),
  splash: () => tone(500, .3, 'sine', .12, 80), boom: () => tone(120, .5, 'sawtooth', .25, 25), crate: () => tone(260, .12, 'square', .08, 70),
  jump: () => tone(300, .09, 'square', .04, 620), pick: () => tone(660, .1, 'square', .07, 1300),
  dead: () => tone(400, .4, 'square', .1, 50), win: () => { tone(523, .12, 'square', .1); setTimeout(() => tone(784, .25, 'square', .1), 130); }
};
addEventListener('click', () => {
  if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  document.getElementById('tip').hidden = true;
});
let showQr = false;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'h') showQr = !showQr;
  if (k === 'm') game.resetRound(true);
});

const game = new Game();
const pads = new Map(); // id -> { conn, seen }
let nextId = 1, peer, code;
const toPad = (id, m) => { const p = pads.get(id); if (p && p.conn.open) p.conn.send(m); };
game.onSfx = k => SFX[k] && SFX[k]();
game.onEvent = (id, k) => toPad(id, { t: 'fx', k });
function drop(id) { const p = pads.get(id); if (!p) return; pads.delete(id); game.removePlayer(id); try { p.conn.close(); } catch (e) {} }
function openRoom() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  code = ''; for (let i = 0; i < 4; i++) code += abc[Math.random() * abc.length | 0];
  peer = new Peer('pixeltreta-' + code);
  peer.on('open', () => {
    const url = new URL('c.html?r=' + code, location.href).href;
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    document.getElementById('url').textContent = url.replace(/^https?:\/\//, '');
    document.getElementById('code').textContent = code;
  });
  peer.on('connection', conn => {
    const id = nextId++;
    conn.on('data', m => {
      const p = pads.get(id);
      if (m.t === 'join' && !p) {
        pads.set(id, { conn, seen: performance.now() });
        const pl = game.addPlayer(id, String(m.name || 'P' + id).slice(0, 8).toUpperCase());
        conn.send({ t: 'you', color: pl.color });
      } else if (m.t === 'in' && p) { p.seen = performance.now(); game.setInput(id, m.b | 0); }
    });
    conn.on('close', () => drop(id)); conn.on('error', () => drop(id));
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { peer.destroy(); openRoom(); }
    else if (!peer.open) document.getElementById('url').textContent = 'sem conexão, recarregue a página';
  });
}
openRoom();
// controle que parou de responder sai do jogo
setInterval(() => { const now = performance.now(); for (const [id, p] of pads) if (now - p.seen > 6000) drop(id); }, 1000);

const joinEl = document.getElementById('join');
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { game.step(); acc -= 1000 / 60; }
  game.render(ctx);
  const n = game.players.size, cls = n === 0 ? 'big' : (n === 1 || showQr) ? 'mid' : 'small';
  if (joinEl.className !== cls) joinEl.className = cls;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
